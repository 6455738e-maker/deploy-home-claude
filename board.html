<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비회원 게시판</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #ffffff;
            --color-page-bg: #f9e0ae;
            --color-text: #333333;
            --color-border: #e0e0e0;
            --color-primary: #007bff;
            --color-primary-hover: #0056b3;
            --color-danger: #dc3545;
            --color-danger-hover: #c82333;
            --color-gray: #6c757d;
            --color-gray-bg: #f8f9fa;
            --color-shadow: rgba(0, 0, 0, 0.1);
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --spacing-2xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #1e1e1e;
                --color-page-bg: #3a2f1a;
                --color-text: #e0e0e0;
                --color-border: #404040;
                --color-primary: #0d6efd;
                --color-primary-hover: #0b5ed7;
                --color-gray-bg: #2d2d2d;
                --color-shadow: rgba(0, 0, 0, 0.3);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--color-page-bg);
            color: var(--color-text);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        .screen {
            background-color: var(--color-bg);
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            box-shadow: 0 2px 12px var(--color-shadow);
        }

        header {
            background-color: var(--color-primary);
            color: white;
            padding: var(--spacing-xl) 0;
            margin-bottom: var(--spacing-2xl);
            box-shadow: 0 2px 4px var(--color-shadow);
        }

        header h1 {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            font-size: 32px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 게시글 목록 화면 */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .posts-header h2 {
            font-size: 24px;
        }

        .btn {
            padding: var(--spacing-md) var(--spacing-lg);
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-hover);
        }

        .btn-secondary {
            background-color: var(--color-gray-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background-color: var(--color-border);
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--color-danger-hover);
        }

        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 12px;
        }

        .post-item {
            padding: var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--color-bg);
        }

        .post-item:hover {
            border-color: var(--color-primary);
            box-shadow: 0 2px 8px var(--color-shadow);
            transform: translateY(-2px);
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            word-break: break-word;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--color-gray);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .post-author-date {
            display: flex;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .post-comment-count {
            background-color: var(--color-primary);
            color: white;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-sm);
            font-weight: 600;
        }

        /* 게시글 상세 화면 */
        .post-detail {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xl);
        }

        .post-detail-header {
            border-bottom: 2px solid var(--color-border);
            padding-bottom: var(--spacing-lg);
        }

        .post-detail-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
            word-break: break-word;
        }

        .post-detail-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--color-gray);
            padding: var(--spacing-md) 0;
            flex-wrap: wrap;
            gap: var(--spacing-lg);
        }

        .post-detail-content {
            padding: var(--spacing-lg) 0;
            font-size: 15px;
            line-height: 1.8;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .post-actions {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        /* 댓글 섹션 */
        .comments-section {
            margin-top: var(--spacing-2xl);
            border-top: 2px solid var(--color-border);
            padding-top: var(--spacing-lg);
        }

        .comments-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
        }

        .comment-form {
            background-color: var(--color-gray-bg);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            color: var(--color-text);
            background-color: var(--color-bg);
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .comment-item {
            padding: var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-gray-bg);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .comment-author {
            font-weight: 600;
            color: var(--color-text);
        }

        .comment-date {
            font-size: 12px;
            color: var(--color-gray);
        }

        .comment-content {
            margin-bottom: var(--spacing-md);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .comment-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        /* 작성/수정 폼 */
        .post-form {
            max-width: 700px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: var(--spacing-xl);
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
            margin-top: var(--spacing-xl);
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .pagination button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            background-color: var(--color-bg);
            color: var(--color-text);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            background-color: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: var(--color-gray);
            font-size: 13px;
        }

        /* 알림 및 에러 메시지 */
        .alert {
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (prefers-color-scheme: dark) {
            .alert-success {
                background-color: #1f3d2a;
                color: #a8d5a8;
                border-color: #2d5a3d;
            }

            .alert-error {
                background-color: #3d2428;
                color: #e8a3a7;
                border-color: #5a3d3f;
            }

            .alert-info {
                background-color: #1f3640;
                color: #7dd3dc;
                border-color: #2d5a66;
            }
        }

        /* 로딩 및 빈 상태 */
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-gray);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-lg);
        }

        .loading {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-gray);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: var(--spacing-md);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }

            header h1 {
                font-size: 24px;
                padding: 0 var(--spacing-md);
            }

            .posts-header {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: stretch;
            }

            .posts-header button {
                width: 100%;
            }

            .post-detail-meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>비회원 게시판</h1>
    </header>

    <div class="container">
        <!-- 경고/성공 메시지 -->
        <div id="alert-container"></div>

        <!-- 게시글 목록 화면 -->
        <div id="list-screen" class="screen active">
            <div class="posts-header">
                <h2>게시글 목록</h2>
                <button class="btn btn-primary" onclick="app.showCreateForm()">새 글 작성</button>
            </div>

            <div id="posts-container" class="posts-list"></div>

            <div id="pagination-container" class="pagination"></div>
        </div>

        <!-- 게시글 상세 화면 -->
        <div id="detail-screen" class="screen">
            <button class="btn btn-secondary" onclick="app.goToList()" style="margin-bottom: var(--spacing-lg);">돌아가기</button>

            <div id="post-detail-container"></div>
        </div>

        <!-- 게시글 작성/수정 화면 -->
        <div id="form-screen" class="screen">
            <button class="btn btn-secondary" onclick="app.goToList()" style="margin-bottom: var(--spacing-lg);">취소</button>

            <div class="post-form">
                <h2 class="form-title" id="form-title">새 글 작성</h2>
                <form id="post-form" onsubmit="app.submitPost(event)">
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" required maxlength="200" placeholder="게시글 제목을 입력하세요">
                    </div>

                    <div class="form-group">
                        <label for="content">내용</label>
                        <textarea id="content" name="content" required placeholder="게시글 내용을 입력하세요"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="author">작성자명</label>
                            <input type="text" id="author" name="author" required maxlength="50" placeholder="작성자명을 입력하세요">
                        </div>

                        <div class="form-group">
                            <label for="password">비밀번호</label>
                            <input type="password" id="password" name="password" required minlength="4" placeholder="최소 4자 이상">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="app.goToList()">취소</button>
                        <button type="submit" class="btn btn-primary" id="submit-btn">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        const app = {
            currentPage: 1,
            totalPages: 1,
            currentPostId: null,

            // 화면 전환
            switchScreen(screenId) {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                window.scrollTo(0, 0);
            },

            // 알림 표시
            showAlert(message, type = 'success') {
                const alertContainer = document.getElementById('alert-container');
                const alertEl = document.createElement('div');
                alertEl.className = `alert alert-${type}`;
                alertEl.textContent = message;
                alertContainer.appendChild(alertEl);

                setTimeout(() => alertEl.remove(), 4000);
            },

            // 에러 처리
            handleError(error, defaultMsg = '요청 중 오류가 발생했습니다.') {
                console.error(error);
                if (error.message === 'Network error') {
                    this.showAlert('서버에 연결할 수 없습니다. 백엔드 서버가 실행 중인지 확인하세요.', 'error');
                } else {
                    this.showAlert(error.message || defaultMsg, 'error');
                }
            },

            // API 호출
            async api(method, path, body = null) {
                try {
                    const options = {
                        method,
                        headers: { 'Content-Type': 'application/json' }
                    };
                    if (body) options.body = JSON.stringify(body);

                    const response = await fetch(`${API_BASE}${path}`, options);
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || '요청에 실패했습니다.');
                    }

                    return data;
                } catch (error) {
                    if (error instanceof TypeError) {
                        throw new Error('Network error');
                    }
                    throw error;
                }
            },

            // 게시글 목록 조회
            async loadPostList(page = 1) {
                try {
                    this.currentPage = page;
                    const data = await this.api('GET', `/posts?page=${page}&limit=10`);

                    const container = document.getElementById('posts-container');
                    const posts = data.data || [];

                    if (posts.length === 0) {
                        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><p>게시글이 없습니다.</p></div>';
                    } else {
                        container.innerHTML = posts.map(post => this.renderPostItem(post)).join('');
                    }

                    this.totalPages = data.pagination?.totalPages || 1;
                    this.renderPagination(data.pagination);
                } catch (error) {
                    this.handleError(error, '게시글 목록을 불러올 수 없습니다.');
                }
            },

            renderPostItem(post) {
                const date = new Date(post.createdAt).toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                const commentCount = post._count?.comments || 0;

                return `
                    <div class="post-item" onclick="app.loadPostDetail(${post.id})">
                        <div class="post-title">${this.escapeHtml(post.title)}</div>
                        <div class="post-meta">
                            <div class="post-author-date">
                                <span><strong>${this.escapeHtml(post.author)}</strong></span>
                                <span>${date}</span>
                            </div>
                            <div class="post-comment-count">${commentCount} 댓글</div>
                        </div>
                    </div>
                `;
            },

            renderPagination(pagination) {
                const container = document.getElementById('pagination-container');
                if (!pagination) {
                    container.innerHTML = '';
                    return;
                }

                const { currentPage, totalPages } = pagination;
                let html = '<button onclick="app.loadPostList(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>처음</button>';
                html += '<button onclick="app.loadPostList(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>이전</button>';
                html += '<span class="pagination-info">' + currentPage + ' / ' + totalPages + '</span>';
                html += '<button onclick="app.loadPostList(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>다음</button>';
                html += '<button onclick="app.loadPostList(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>마지막</button>';

                container.innerHTML = html;
            },

            // 게시글 상세 조회
            async loadPostDetail(id) {
                try {
                    this.currentPostId = id;
                    const data = await this.api('GET', `/posts/${id}`);
                    const post = data.data;

                    const container = document.getElementById('post-detail-container');
                    const createdDate = new Date(post.createdAt).toLocaleString('ko-KR');
                    const updatedDate = new Date(post.updatedAt).toLocaleString('ko-KR');

                    let html = `
                        <div class="post-detail">
                            <div class="post-detail-header">
                                <h2 class="post-detail-title">${this.escapeHtml(post.title)}</h2>
                                <div class="post-detail-meta">
                                    <div>
                                        <strong>작성자:</strong> ${this.escapeHtml(post.author)}
                                    </div>
                                    <div>
                                        <strong>작성일:</strong> ${createdDate}
                                    </div>
                                </div>
                                ${post.updatedAt !== post.createdAt ? `<div style="font-size: 12px; color: var(--color-gray); margin-top: var(--spacing-md);">수정일: ${updatedDate}</div>` : ''}
                            </div>
                            <div class="post-detail-content">${this.escapeHtml(post.content)}</div>
                            <div class="post-actions">
                                <button class="btn btn-primary" onclick="app.showEditForm(${id})">수정</button>
                                <button class="btn btn-danger" onclick="app.deletePostPrompt(${id})">삭제</button>
                            </div>
                    `;

                    html += `
                            <div class="comments-section">
                                <h3 class="comments-title">댓글</h3>
                    `;

                    // 댓글 작성 폼
                    html += `
                                <div class="comment-form">
                                    <form onsubmit="app.submitComment(event, ${id})">
                                        <div class="form-group">
                                            <label for="comment-author">작성자명</label>
                                            <input type="text" id="comment-author" name="comment-author" required maxlength="50" placeholder="작성자명">
                                        </div>
                                        <div class="form-group">
                                            <label for="comment-content">댓글 내용</label>
                                            <textarea id="comment-content" name="comment-content" required maxlength="500" placeholder="댓글을 입력하세요" style="min-height: 80px;"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label for="comment-password">비밀번호</label>
                                            <input type="password" id="comment-password" name="comment-password" required minlength="4" placeholder="최소 4자 이상">
                                        </div>
                                        <button type="submit" class="btn btn-primary">댓글 작성</button>
                                    </form>
                                </div>
                    `;

                    // 댓글 목록
                    const comments = post.comments || [];
                    if (comments.length === 0) {
                        html += '<div class="empty-state"><p>댓글이 없습니다.</p></div>';
                    } else {
                        html += '<div class="comments-list">' + comments.map(comment => this.renderComment(comment)).join('') + '</div>';
                    }

                    html += `
                            </div>
                        </div>
                    `;

                    container.innerHTML = html;
                    this.switchScreen('detail-screen');
                } catch (error) {
                    this.handleError(error, '게시글을 불러올 수 없습니다.');
                }
            },

            renderComment(comment) {
                const date = new Date(comment.createdAt).toLocaleString('ko-KR');

                return `
                    <div class="comment-item">
                        <div class="comment-header">
                            <div>
                                <span class="comment-author">${this.escapeHtml(comment.author)}</span>
                                <span class="comment-date">${date}</span>
                            </div>
                            <div class="comment-actions">
                                <button class="btn btn-sm btn-secondary" onclick="app.editCommentPrompt(${comment.id})">수정</button>
                                <button class="btn btn-sm btn-danger" onclick="app.deleteCommentPrompt(${comment.id})">삭제</button>
                            </div>
                        </div>
                        <div class="comment-content">${this.escapeHtml(comment.content)}</div>
                    </div>
                `;
            },

            // 작성 폼 표시
            showCreateForm() {
                document.getElementById('form-title').textContent = '새 글 작성';
                document.getElementById('submit-btn').textContent = '작성';
                document.getElementById('post-form').reset();
                document.getElementById('post-form').dataset.editId = '';
                this.switchScreen('form-screen');
            },

            // 수정 폼 표시
            async showEditForm(id) {
                const password = prompt('비밀번호를 입력하세요:');
                if (password === null) return;

                if (password.length < 4) {
                    this.showAlert('비밀번호는 최소 4자 이상이어야 합니다.', 'error');
                    return;
                }

                try {
                    const data = await this.api('GET', `/posts/${id}`);
                    const post = data.data;

                    // 실제로는 서버에서 비밀번호 확인을 해야 하지만,
                    // 여기서는 클라이언트에서 임시로 표시만 함
                    document.getElementById('form-title').textContent = '글 수정';
                    document.getElementById('submit-btn').textContent = '수정';
                    document.getElementById('title').value = post.title;
                    document.getElementById('content').value = post.content;
                    document.getElementById('author').value = post.author;
                    document.getElementById('password').value = password;
                    document.getElementById('post-form').dataset.editId = id;

                    this.switchScreen('form-screen');
                } catch (error) {
                    this.handleError(error, '게시글을 불러올 수 없습니다.');
                }
            },

            // 게시글 저장
            async submitPost(event) {
                event.preventDefault();

                const form = document.getElementById('post-form');
                const editId = form.dataset.editId;
                const isEdit = !!editId;

                const postData = {
                    title: document.getElementById('title').value,
                    content: document.getElementById('content').value,
                    author: document.getElementById('author').value,
                    password: document.getElementById('password').value
                };

                try {
                    if (isEdit) {
                        await this.api('PUT', `/posts/${editId}`, postData);
                        this.showAlert('게시글이 수정되었습니다.');
                        this.loadPostDetail(editId);
                    } else {
                        const data = await this.api('POST', '/posts', postData);
                        this.showAlert('게시글이 작성되었습니다.');
                        this.loadPostList(1);
                        this.switchScreen('list-screen');
                    }
                } catch (error) {
                    this.handleError(error, '게시글 저장에 실패했습니다.');
                }
            },

            // 게시글 삭제 프롬프트
            deletePostPrompt(id) {
                const password = prompt('비밀번호를 입력하세요:');
                if (password === null) return;
                this.deletePost(id, password);
            },

            // 게시글 삭제
            async deletePost(id, password) {
                if (!confirm('정말 삭제하시겠습니까?')) return;

                try {
                    await this.api('DELETE', `/posts/${id}`, { password });
                    this.showAlert('게시글이 삭제되었습니다.');
                    this.loadPostList(1);
                    this.switchScreen('list-screen');
                } catch (error) {
                    this.handleError(error, '게시글 삭제에 실패했습니다.');
                }
            },

            // 댓글 작성
            async submitComment(event, postId) {
                event.preventDefault();

                const commentData = {
                    author: document.getElementById('comment-author').value,
                    content: document.getElementById('comment-content').value,
                    password: document.getElementById('comment-password').value
                };

                try {
                    await this.api('POST', `/posts/${postId}/comments`, commentData);
                    this.showAlert('댓글이 작성되었습니다.');
                    this.loadPostDetail(postId);
                } catch (error) {
                    this.handleError(error, '댓글 작성에 실패했습니다.');
                }
            },

            // 댓글 수정 프롬프트
            async editCommentPrompt(commentId) {
                const password = prompt('비밀번호를 입력하세요:');
                if (password === null) return;

                const content = prompt('댓글 내용을 수정하세요:');
                if (content === null) return;

                if (content.length === 0) {
                    this.showAlert('댓글 내용은 비워둘 수 없습니다.', 'error');
                    return;
                }

                if (content.length > 500) {
                    this.showAlert('댓글은 500자를 초과할 수 없습니다.', 'error');
                    return;
                }

                try {
                    await this.api('PUT', `/comments/${commentId}`, { content, password });
                    this.showAlert('댓글이 수정되었습니다.');
                    this.loadPostDetail(this.currentPostId);
                } catch (error) {
                    this.handleError(error, '댓글 수정에 실패했습니다.');
                }
            },

            // 댓글 삭제 프롬프트
            deleteCommentPrompt(commentId) {
                const password = prompt('비밀번호를 입력하세요:');
                if (password === null) return;
                this.deleteComment(commentId, password);
            },

            // 댓글 삭제
            async deleteComment(commentId, password) {
                if (!confirm('정말 삭제하시겠습니까?')) return;

                try {
                    await this.api('DELETE', `/comments/${commentId}`, { password });
                    this.showAlert('댓글이 삭제되었습니다.');
                    this.loadPostDetail(this.currentPostId);
                } catch (error) {
                    this.handleError(error, '댓글 삭제에 실패했습니다.');
                }
            },

            // 목록으로 이동
            goToList() {
                this.loadPostList(1);
                this.switchScreen('list-screen');
            },

            // HTML 이스케이프
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            // 초기화
            init() {
                this.loadPostList(1);
            }
        };

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
