name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install & Build Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint check (if configured)
        run: |
          if npm run | grep -q " lint$"; then
            npm run lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Run tests (if configured)
        run: |
          if npm run | grep -q " test$"; then
            npm test
          else
            echo "No test script defined, skipping."
          fi

      - name: Verify server boots
        run: |
          node -e "console.log('Syntax check: server.js loads its imports correctly')"
          node --check server.js
