<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        .image-1 {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .image-1 img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="image-1" data-node-id="8:69" data-name="image 1">
        <img src="assets/figma-image-1.png" alt="">
    </div>
</body>
</html>
